name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BAKER_DESIGN_TEST_ALLOW_NETWORK: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install declared Python dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate public release surface
        run: python tools/validate_release.py

      - name: Run offline unit tests
        run: >-
          python -m unittest discover
          -s skills/baker-protein-design/scripts
          -p "test_*.py"
          -v

      - name: Reject bytecode cache in the deliverable
        shell: bash
        run: |
          if find skills -type d -name __pycache__ -o -type f -name '*.pyc' | grep -q .; then
            echo "Python cache files were created inside skills/"
            exit 1
          fi
